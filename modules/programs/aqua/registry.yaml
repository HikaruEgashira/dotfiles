packages:
  - type: github_release
    repo_owner: googleworkspace
    repo_name: cli
    asset: google-workspace-cli-{{.Arch}}-{{.OS}}.{{.Format}}
    format: tar.gz
    files:
      - name: gws
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
      windows: pc-windows-msvc
    checksum:
      type: github_release
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
  - type: github_release
    repo_owner: withgraphite
    repo_name: homebrew-tap
    asset: gt-{{.OS}}-{{.Arch}}
    format: raw
    overrides:
      - goos: linux
        goarch: amd64
        asset: gt-{{.OS}}
      - goos: darwin
        replacements:
          amd64: x64
    files:
      - name: gt
    replacements:
      darwin: macos
    supported_envs:
      - linux
      - darwin
  - type: github_release
    repo_owner: higgsfield-ai
    repo_name: cli
    asset: hf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    files:
      - name: higgsfield
        src: hf
      - name: higgs
        src: hf
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
  - type: github_release
    repo_owner: sisaku-security
    repo_name: sisakulint
    asset: sisakulint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    supported_envs:
      - linux
      - darwin
    checksum:
      type: github_release
      asset: sisakulint_{{trimV .Version}}_checksums.txt
      algorithm: sha256
  - type: github_release
    repo_owner: pingdotgg
    repo_name: t3code
    asset: t3-{{trimV .Version}}-{{.OS}}-{{.Arch}}.tar.gz
    format: tar.gz
    files:
      - name: t3
        src: t3-{{trimV .Version}}-{{.OS}}-{{.Arch}}/t3
    replacements:
      amd64: x64
    supported_envs:
      - darwin/arm64
      - linux/amd64
    checksum:
      type: github_release
      asset: SHA256SUMS
      algorithm: sha256
  - type: github_release
    repo_owner: bitwarden
    repo_name: clients
    version_prefix: cli-
    asset: bw-{{.OS}}-{{.Arch}}-{{trimV .SemVer}}.{{.Format}}
    format: zip
    files:
      - name: bw
    replacements:
      darwin: macos
    # x64 版だけ asset 名に arch が付かない
    overrides:
      - goos: darwin
        goarch: amd64
        asset: bw-{{.OS}}-{{trimV .SemVer}}.{{.Format}}
      - goos: linux
        goarch: amd64
        asset: bw-{{.OS}}-{{trimV .SemVer}}.{{.Format}}
    supported_envs:
      - darwin
      - linux/amd64
  - type: http
    repo_owner: openai
    repo_name: codex
    url: https://registry.npmjs.org/@openai/codex/-/codex-{{.Version}}-{{.OS}}-{{.Arch}}.tgz
    format: tar.gz
    files:
      - name: codex
        src: package/vendor/aarch64-apple-darwin/bin/codex
    replacements:
      amd64: x64
    overrides:
      - goos: linux
        files:
          - name: codex
            src: package/vendor/x86_64-unknown-linux-musl/bin/codex
    supported_envs:
      - darwin/arm64
      - linux/amd64
  - type: http
    repo_owner: anomalyco
    repo_name: opencode
    url: https://registry.npmjs.org/@opencode/cli-{{.OS}}-{{.Arch}}/-/cli-{{.OS}}-{{.Arch}}-{{.Version}}.tgz
    format: tar.gz
    files:
      - name: opencode
        src: package/bin/opencode
    replacements:
      amd64: x64
    supported_envs:
      - darwin/arm64
      - linux/amd64
  - type: github_release
    repo_owner: HikaruEgashira
    repo_name: nuphy-air60-v2-tools
    asset: nuphy-air60-v2-tools-macos-arm64.tar.gz
    format: tar.gz
    supported_envs:
      - darwin/arm64
    files:
      - name: kvm-switch
        src: bin/kvm-switch
      - name: ddc
        src: bin/ddc
      - name: via-raw
        src: bin/via-raw
      - name: input-source
        src: bin/input-source
      - name: nrf-dfu
        src: bin/nrf-dfu
      - name: ble-scan
        src: bin/ble-scan
      - name: snap
        src: bin/snap
