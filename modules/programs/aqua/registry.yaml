packages:
  - type: github_release
    repo_owner: googleworkspace
    repo_name: cli
    asset: google-workspace-cli-{{.Arch}}-{{.OS}}.{{.Format}}
    format: tar.gz
    files:
      - name: gws
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
      windows: pc-windows-msvc
    checksum:
      type: github_release
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
  - type: github_release
    repo_owner: withgraphite
    repo_name: homebrew-tap
    asset: gt-{{.OS}}-{{.Arch}}
    format: raw
    overrides:
      - goos: linux
        goarch: amd64
        asset: gt-{{.OS}}
      - goos: darwin
        replacements:
          amd64: x64
    files:
      - name: gt
    replacements:
      darwin: macos
    supported_envs:
      - linux
      - darwin
  - type: github_release
    repo_owner: higgsfield-ai
    repo_name: cli
    asset: hf_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    files:
      - name: higgsfield
        src: hf
      - name: higgs
        src: hf
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
  - type: github_release
    repo_owner: sisaku-security
    repo_name: sisakulint
    asset: sisakulint_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
    format: tar.gz
    supported_envs:
      - linux
      - darwin
    checksum:
      type: github_release
      asset: sisakulint_{{trimV .Version}}_checksums.txt
      algorithm: sha256
  - type: github_release
    repo_owner: pingdotgg
    repo_name: t3code
    asset: t3-{{trimV .Version}}-{{.OS}}-{{.Arch}}.tar.gz
    format: tar.gz
    files:
      - name: t3
        src: t3-{{trimV .Version}}-{{.OS}}-{{.Arch}}/t3
    supported_envs:
      - darwin/arm64
    checksum:
      type: github_release
      asset: SHA256SUMS
      algorithm: sha256
  - type: github_release
    repo_owner: bitwarden
    repo_name: clients
    version_prefix: cli-
    asset: bw-{{.OS}}-{{.Arch}}-{{trimV .SemVer}}.{{.Format}}
    format: zip
    files:
      - name: bw
    replacements:
      darwin: macos
    overrides:
      - goos: darwin
        goarch: amd64
        asset: bw-{{.OS}}-{{trimV .SemVer}}.{{.Format}}
    supported_envs:
      - darwin
  - type: http
    repo_owner: openai
    repo_name: codex
    url: https://registry.npmjs.org/@openai/codex/-/codex-{{.Version}}-darwin-arm64.tgz
    format: tar.gz
    files:
      - name: codex
        src: package/vendor/aarch64-apple-darwin/bin/codex
    supported_envs:
      - darwin/arm64
  - type: http
    repo_owner: anomalyco
    repo_name: opencode
    url: https://registry.npmjs.org/@opencode/cli-darwin-arm64/-/cli-darwin-arm64-{{.Version}}.tgz
    format: tar.gz
    files:
      - name: opencode
        src: package/bin/opencode
    supported_envs:
      - darwin/arm64
  - type: http
    repo_owner: anthropics
    repo_name: claude-code
    url: https://downloads.claude.ai/claude-code-releases/{{.Version}}/darwin-arm64/claude
    format: raw
    files:
      - name: claude
    supported_envs:
      - darwin/arm64
