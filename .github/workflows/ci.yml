name: "CI"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        timeout-minutes: 5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Run formatter check
        timeout-minutes: 5
        run: nix build --no-link --print-build-logs '.#checks.x86_64-linux.formatting'
      - name: Lint Brewfile (no vscode entries)
        # VS Code 拡張は modules/programs/vscode.nix (nix-vscode-extensions) で管理する。
        # Brewfile に `vscode "..."` 行が混入したら declarative 経路から外れるので CI fail。
        timeout-minutes: 1
        run: |
          if grep -E '^vscode\s+"' Brewfile >/dev/null; then
            echo "FAIL: Brewfile contains vscode '...' lines."
            echo "  → migrate to modules/programs/vscode.nix (nix-vscode-extensions overlay)"
            grep -nE '^vscode\s+"' Brewfile
            exit 1
          fi
          echo "OK: no vscode entries in Brewfile"
      - name: Run linters (deadnix + shellcheck)
        timeout-minutes: 5
        run: nix run --accept-flake-config '.#lint'
      - name: Build MEL (Minimum Equipment List)
        # MEL は essential 階層: 失敗したら全 PR をブロックする。
        # 通常 packages の breakage は eval gate のみ (warning 扱い)。
        timeout-minutes: 15
        run: nix build --no-link --print-build-logs --accept-flake-config '.#checks.x86_64-linux.mel'
      - name: Evaluate home-manager configuration
        # 完全ビルドは crush 等の go テスト走行で 25min を超える上、
        # 実際にデプロイされるのは aarch64-darwin。eval だけでも cocoapods
        # のような platform-mismatch は捕捉できるので CI ではここで止める。
        timeout-minutes: 10
        run: |
          nix eval --raw '.#checks.x86_64-linux.build.drvPath'
          echo
          echo "evaluated successfully"
      - name: Eval determinism gate
        # drvPath が 2 回の eval で一致しない = builtins.currentTime / 環境依存 / IFD 等の
        # impurity が紛れ込んだサイン。eval だけなので cheap。build determinism は別途。
        timeout-minutes: 5
        run: |
          h1=$(nix eval --raw '.#checks.x86_64-linux.build.drvPath')
          h2=$(nix eval --raw --no-eval-cache '.#checks.x86_64-linux.build.drvPath')
          if [ "$h1" != "$h2" ]; then
            echo "FAIL: drvPath differs across evaluations"
            echo "  first:  $h1"
            echo "  second: $h2"
            exit 1
          fi
          echo "OK: drvPath stable across evaluations"
          echo "  $h1"
