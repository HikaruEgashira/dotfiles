name: "CI"
on:
  # flake-update の bot push は workflow を起動しないため、明示 dispatch を受ける
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  fetchurl-provenance:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        timeout-minutes: 5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Lock newly added flake inputs before evaluation
        # flake.nix に input を足した PR では lock entry が flake-update 経由で入るまで欠ける。
        # eval 中に nix が flake.lock を書き換えると formatter check の source hash が崩れるため、先に lock を確定させる
        timeout-minutes: 5
        run: nix flake lock
      - name: Verify fetchurl signatures (sigstore + GPG)
        timeout-minutes: 10
        run: nix shell --inputs-from . nixpkgs#cosign nixpkgs#gnupg nixpkgs#curl nixpkgs#coreutils nixpkgs#gawk --command bash scripts/fetchurl-provenance.sh

  validate:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        timeout-minutes: 5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Lock newly added flake inputs before evaluation
        # flake.nix に input を足した PR では lock entry が flake-update 経由で入るまで欠ける。
        # eval 中に nix が flake.lock を書き換えると formatter check の source hash が崩れるため、先に lock を確定させる
        timeout-minutes: 5
        run: nix flake lock
      - name: Run formatter check
        timeout-minutes: 5
        run: nix build --no-link --print-build-logs '.#checks.x86_64-linux.formatting'
      - name: Run linters (deadnix + shellcheck)
        timeout-minutes: 5
        run: nix run --accept-flake-config '.#lint'
      - name: Run activation tests
        timeout-minutes: 5
        run: |
          for t in tests/*.sh; do
            echo "==> $t"
            bash "$t"
          done
      - name: Verify AI CLI provenance behind Aqua pins
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix shell --inputs-from . nixpkgs#gh nixpkgs#gnupg nixpkgs#jq nixpkgs#curl nixpkgs#coreutils nixpkgs#python3 --command bash scripts/aqua-provenance.sh
      - name: Verify pi npm extension signatures
        timeout-minutes: 10
        working-directory: modules/programs/harness/pi-npm
        run: npm ci --ignore-scripts && npm audit signatures
      - name: Guard pi npm pins and provenance ledger
        run: python3 tests/pi-npm-provenance.py
      - name: Guard Aqua provenance ledger
        run: python3 tests/aqua-provenance-ledger.py
      - name: Guard fetchurl provenance ledger
        run: python3 tests/fetchurl-provenance.py
      - name: Test CLIProxyAPI credential rendering
        run: python3 tests/cliproxyapi-config.py
      - name: Test Fleet controller
        run: python3 -I tests/fleet-controller.py
      - name: Test encrypted Store unlock
        timeout-minutes: 5
        run: nix shell --inputs-from . nixpkgs#python3 --command python3 tests/nix-store.py
      - name: Test ghq clone retention safety
        timeout-minutes: 5
        run: nix shell --inputs-from . nixpkgs#python3 --command python3 tests/ghq-clean.py
      - name: Test ssh-agent socket recovery
        timeout-minutes: 5
        run: nix shell --inputs-from . nixpkgs#python3 nixpkgs#openssh --command python3 tests/ssh-agent-start.py
      - name: Test locked worktree retention
        timeout-minutes: 5
        run: nix shell --inputs-from . nixpkgs#python3 --command python3 tests/clean-worktree.py
      - name: Test Pi skill discovery audit
        timeout-minutes: 5
        run: nix build --no-link --print-build-logs '.#checks.x86_64-linux.skills-audit'
      - name: Test launchd audit inventory classification
        timeout-minutes: 5
        run: nix build --no-link --print-build-logs '.#checks.x86_64-linux.launchd-audit'
      - name: Guard the XDG entry schema
        timeout-minutes: 5
        run: nix build --no-link --print-build-logs '.#checks.x86_64-linux.xdg-entries-guards'
      - name: Build MEL (Minimum Equipment List)
        # MEL は essential 階層: 失敗したら全 PR をブロックする。
        # 通常 packages の breakage は eval gate のみ (warning 扱い)。
        timeout-minutes: 15
        run: nix build --no-link --print-build-logs --accept-flake-config '.#checks.x86_64-linux.mel'
      - name: Evaluate home-manager configuration
        # 完全ビルドは crush 等の go テスト走行で 25min を超える上、
        # 実際にデプロイされるのは aarch64-darwin。eval だけでも cocoapods
        # のような platform-mismatch は捕捉できるので CI ではここで止める。
        timeout-minutes: 10
        run: |
          nix eval --raw '.#checks.x86_64-linux.build.drvPath'
          nix eval --raw '.#homeConfigurations.hikae@mac-studio.activationPackage.drvPath'
          nix eval --raw '.#nixosConfigurations.wsl.config.system.build.toplevel.drvPath'
          echo
          echo "evaluated successfully"
      - name: Build ms-a2 sudo auth files
        timeout-minutes: 10
        run: nix build --no-link --print-build-logs '.#checks.x86_64-linux.ms-a2-no-sudo-agent'
      - name: Eval determinism gate
        # drvPath が 2 回の eval で一致しない = builtins.currentTime / 環境依存 / IFD 等の
        # impurity が紛れ込んだサイン。eval だけなので cheap。build determinism は別途。
        timeout-minutes: 5
        run: |
          h1=$(nix eval --raw '.#checks.x86_64-linux.build.drvPath')
          h2=$(nix eval --raw --no-eval-cache '.#checks.x86_64-linux.build.drvPath')
          if [ "$h1" != "$h2" ]; then
            echo "FAIL: drvPath differs across evaluations"
            echo "  first:  $h1"
            echo "  second: $h2"
            exit 1
          fi
          echo "OK: drvPath stable across evaluations"
          echo "  $h1"

  # CI を通った main だけを deploy に進める。Fleet controller (hosts/ms-a2/fleet.nix) はこの ref だけを端末へ配る
  promote:
    needs: [fetchurl-provenance, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: promote-deploy
      cancel-in-progress: false
    steps:
      - name: Fast-forward deploy to the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/heads/deploy" >/dev/null 2>&1; then
            # force=false なので、後着の古い run が deploy を巻き戻すことはない (non fast-forward は 422)
            if ! gh api -X PATCH "repos/$REPO/git/refs/heads/deploy" -f sha="$SHA" -F force=false >/dev/null; then
              status=$(gh api "repos/$REPO/compare/$SHA...deploy" --jq .status)
              [ "$status" = ahead ] || [ "$status" = identical ] || { echo "::error::deploy could not move to $SHA ($status)"; exit 1; }
              echo "deploy is already ahead of $SHA"
            fi
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/deploy -f sha="$SHA" >/dev/null
          fi
