name: "CI"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31.10.5
        timeout-minutes: 5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run formatter check
        timeout-minutes: 5
        run: nix build --no-link --print-build-logs '.#checks.x86_64-linux.formatting'
      - name: Evaluate home-manager configuration
        # 完全ビルドは crush 等の go テスト走行で 25min を超える上、
        # 実際にデプロイされるのは aarch64-darwin。eval だけでも cocoapods
        # のような platform-mismatch は捕捉できるので CI ではここで止める。
        timeout-minutes: 10
        run: |
          nix eval --raw '.#checks.x86_64-linux.build.drvPath'
          echo
          echo "evaluated successfully"
