name: "flake-update"
on:
  schedule:
    - cron: "0 4 * * 1" # 毎週月曜 04:00 UTC (= 月曜 13:00 JST)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: true
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        timeout-minutes: 5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run nix flake update
        timeout-minutes: 10
        run: nix flake update
      - name: Commit and push if flake.lock changed
        id: push
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if git diff --quiet flake.lock; then
            echo "no flake.lock changes"
            echo "pushed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: nix flake update"
          git push origin main
          echo "pushed=true" >>"$GITHUB_OUTPUT"
      - name: Run CI for the pushed commit
        # GITHUB_TOKEN の push は workflow を起動しないので、dispatch で明示的に回す
        if: steps.push.outputs.pushed == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref main
          gh workflow run activation-darwin.yml --ref main
