name: "flake-update"
on:
  schedule:
    - cron: "0 4 * * 1" # 毎週月曜 04:00 UTC (= 月曜 13:00 JST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "bump と gate だけ走らせ、push しない"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    timeout-minutes: 15
    runs-on: hikae-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: true
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        timeout-minutes: 5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run nix flake update
        timeout-minutes: 10
        run: nix flake update
      - name: Substitutable gate
        # runner は aarch64-linux だが dry-run は eval + cache 問い合わせだけなので darwin 閉包も判定できる
        timeout-minutes: 10
        run: nix run '.#substitutable-gate'
      - name: Commit and push if flake.lock changed
        id: push
        if: ${{ !inputs.dry_run }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if git diff --quiet flake.lock; then
            echo "no flake.lock changes"
            echo "pushed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: nix flake update"
          git push origin main
          echo "pushed=true" >>"$GITHUB_OUTPUT"
      - name: Run CI for the pushed commit
        # GITHUB_TOKEN の push は workflow を起動しないので、dispatch で明示的に回す
        if: steps.push.outputs.pushed == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref main
